<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>こけりうむ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: vessel stage on the left, growth ladder + rewards on the right; stacks on phones. */
  :root {
    --bg: #101a14;
    --panel: #18261d;
    --line: #2c4234;
    --text: #dfeee2;
    --muted: #8fae98;
    --accent: #a3c94a;
    --btn: #223a2a;
    --btn-on: #3a6646;
    --warn: #e0806a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #1d3326 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Zen Maru Gothic", "Hiragino Sans", system-ui, sans-serif;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    user-select: none; -webkit-user-select: none;
  }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .15em; color: var(--accent); }
  nav { display: flex; gap: 6px; font-size: 13px; }
  nav a { color: var(--muted); text-decoration: none; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); }
  nav a[aria-current] { color: var(--text); background: var(--btn-on); border-color: transparent; }
  main { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; justify-content: center; }
  .stage-wrap { position: relative; flex: 0 1 380px; min-width: 0; }
  #stage {
    display: block; width: 100%; max-width: 380px; aspect-ratio: 380 / 520; height: auto;
    border-radius: 16px; background: #0c140f; box-shadow: 0 20px 50px rgba(0,0,0,.45);
    touch-action: none; cursor: pointer;
  }
  #overlay {
    position: absolute; inset: 0; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    text-align: center; padding: 20px; background: rgba(10,18,13,.78); backdrop-filter: blur(2px);
  }
  #overlay[hidden] { display: none; }
  #overlay h2 { margin: 0; font-size: 26px; letter-spacing: .1em; color: var(--accent); }
  #overlay p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
  #overlay p b { color: var(--text); font-size: 22px; }
  .vessel-pick { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--line);
    border-radius: 10px; cursor: pointer; padding: 8px 14px; font-size: 14px;
  }
  button:hover { border-color: #4b7a57; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .vessel-pick button small { display: block; font-size: 11px; color: var(--muted); }
  .side { flex: 1 1 260px; min-width: 0; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; letter-spacing: .05em; }
  .row { display: flex; gap: 14px; align-items: center; }
  #next { width: 64px; height: 64px; display: block; }
  .stats { flex: 1; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; margin: 0; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  #ladder { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 4px; }
  #ladder li { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--muted); opacity: .45; }
  #ladder li.seen { opacity: 1; color: var(--text); }
  #ladder li.now { color: var(--accent); }
  #ladder canvas { width: 36px; height: 36px; display: block; }
  #log { font-size: 12px; color: var(--muted); line-height: 1.7; min-height: 3.4em; }
  #log div:first-child { color: var(--text); }
  .help { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.7; }
</style>

<div class="wrap">
  <header>
    <h1>こけりうむ</h1>
    <nav><a href="./" aria-current="page">あつめる</a><a href="./garden.html">つくる</a></nav>
  </header>
  <main>
    <div class="stage-wrap">
      <canvas id="stage"></canvas>
      <div id="overlay">
        <h2 id="ov-title">苔玉ころころ</h2>
        <p id="ov-text">同じ苔がくっつくと、ひとつ大きく育つ。<br>縁からあふれたらおしまい。<br>育てた苔と、そばで拾った置物は「つくる」で使える。</p>
        <div class="vessel-pick" id="vpick"></div>
      </div>
    </div>
    <div class="side">
      <div class="card row">
        <div><div class="label">つぎ</div><canvas id="next"></canvas></div>
        <dl class="stats">
          <dt>スコア</dt><dd id="score">0</dd>
          <dt>ベスト</dt><dd id="best">0</dd>
          <dt id="spill-dt">こぼれ</dt><dd id="spill">—</dd>
        </dl>
      </div>
      <div class="card">
        <div class="label">育ち方</div>
        <ol id="ladder"></ol>
      </div>
      <div class="card">
        <div class="label">手に入れたもの</div>
        <div id="log"></div>
      </div>
      <p class="help">
        うつわの上でカーソルを動かして、クリックで落とす（スマホはなぞって離す）。← → と Space でも操作できる。<br>
        置物は合体しないけど、そばで苔玉以上に育てると拾える。平皿は5回こぼすとおしまい。
      </p>
    </div>
  </main>
</div>

<script>
(() => {
  'use strict';
  const W = 380, H = 520;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  stage.width = W * DPR; stage.height = H * DPR;
  const ctx = stage.getContext('2d');
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* ignore */ } },
  };

  const MOSS = [
    { name: 'スナゴケ',         base: '#c2cf3a', dark: '#8a9520', light: '#e8f08a', style: 'star' },
    { name: 'ハイゴケ',         base: '#5f9e3f', dark: '#3d6f27', light: '#8fc56a', style: 'creep' },
    { name: 'タマゴケ',         base: '#5fc08a', dark: '#2f8a5c', light: '#a8e6c0', style: 'ball' },
    { name: 'ヒノキゴケ',       base: '#2f6e3e', dark: '#1d4a29', light: '#5fa86c', style: 'tree' },
    { name: 'ホソバオキナゴケ', base: '#a9c7a1', dark: '#7a9c74', light: '#e0efdb', style: 'cushion' },
    { name: 'コツボゴケ',       base: '#6cc06f', dark: '#3f8c45', light: '#aee6aa', style: 'leaf' },
    { name: 'シッポゴケ',       base: '#4f7f3a', dark: '#33572a', light: '#8bb86a', style: 'tail' },
  ];

  const DRAW = {
    mound(g, x, y, s, it) {
      const m = MOSS[it.t] || MOSS[0], r = rng(it.seed);
      const w = (14 + r() * 8) * s, h = (8 + r() * 6) * s;
      const grad = g.createLinearGradient(0, y - h, 0, y);
      grad.addColorStop(0, m.light); grad.addColorStop(.5, m.base); grad.addColorStop(1, m.dark);
      g.fillStyle = grad;
      g.beginPath(); g.ellipse(x, y, w, h, 0, Math.PI, 0); g.closePath(); g.fill();
      for (let i = 0; i < 16; i++) {
        const a = Math.PI + r() * Math.PI, d = .5 + r() * .5;
        g.fillStyle = r() < .6 ? m.light : m.dark;
        g.globalAlpha = .5;
        g.beginPath(); g.arc(x + Math.cos(a) * w * d, y + Math.sin(a) * h * d, (1 + r() * 1.5) * s, 0, 7); g.fill();
      }
      g.globalAlpha = 1;
      if (m.style === 'ball') {
        for (let i = 0; i < 3; i++) {
          const px = x + (r() - .5) * w, py = y - h * .8;
          g.strokeStyle = '#8a5a2b'; g.lineWidth = 1;
          g.beginPath(); g.moveTo(px, py + 3 * s); g.lineTo(px, py - 4 * s); g.stroke();
          g.fillStyle = '#d4ea86'; g.beginPath(); g.arc(px, py - 4 * s, 2 * s, 0, 7); g.fill();
        }
      } else if (m.style === 'tree') {
        for (let i = 0; i < 3; i++) {
          const px = x + (r() - .5) * w * 1.2, py = y - h * (.4 + r() * .4);
          g.strokeStyle = m.light; g.lineWidth = 1;
          for (let k = 0; k < 4; k++) {
            const yy = py - 8 * s + k * 2.2 * s, ww = (1.5 + k * 1.2) * s;
            g.beginPath(); g.moveTo(px - ww, yy + s); g.lineTo(px, yy); g.lineTo(px + ww, yy + s); g.stroke();
          }
        }
      }
    },
    stone(g, x, y, s, it) {
      const r = rng(it.seed), w = (8 + r() * 6) * s, h = (5 + r() * 4) * s;
      const grad = g.createRadialGradient(x - w * .3, y - h * 1.2, 1, x, y - h * .5, w * 1.2);
      grad.addColorStop(0, '#c9c6bd'); grad.addColorStop(1, '#5f5c55');
      g.fillStyle = grad;
      g.beginPath(); g.ellipse(x, y - h * .4, w, h, (r() - .5) * .3, 0, 7); g.fill();
      g.fillStyle = 'rgba(120,170,80,.55)';
      g.beginPath(); g.ellipse(x - w * .2, y - h * 1.1, w * .4, h * .25, 0, 0, 7); g.fill();
    },
    fern(g, x, y, s, it) {
      const r = rng(it.seed);
      g.strokeStyle = '#4e9a52'; g.lineCap = 'round';
      const n = 4 + ((r() * 3) | 0);
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (i / (n - 1) - .5) * 2.2;
        const L = (16 + r() * 8) * s;
        const ex = x + Math.cos(a) * L, ey = y + Math.sin(a) * L;
        const cx = x + Math.cos(a) * L * .5 + Math.cos(a) * 4 * s, cy = y + Math.sin(a) * L * .5 - 6 * s;
        g.lineWidth = 1.2 * s;
        g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(cx, cy, ex, ey); g.stroke();
        g.lineWidth = 1;
        for (let k = 2; k < 8; k++) {
          const t = k / 8, px = (1 - t) * (1 - t) * x + 2 * (1 - t) * t * cx + t * t * ex;
          const py = (1 - t) * (1 - t) * y + 2 * (1 - t) * t * cy + t * t * ey;
          const lw = (1 - t) * 4 * s + s;
          g.beginPath(); g.moveTo(px - lw, py - lw * .4); g.lineTo(px, py); g.lineTo(px + lw, py - lw * .4); g.stroke();
        }
      }
    },
    mushroom(g, x, y, s, it) {
      const r = rng(it.seed);
      const caps = ['#c0533a', '#d9a441', '#a86b3c', '#e6d7b8'];
      const cap = caps[(r() * caps.length) | 0], h = (8 + r() * 6) * s, w = (5 + r() * 3) * s;
      g.fillStyle = '#efe6d2';
      g.fillRect(x - 1.4 * s, y - h, 2.8 * s, h);
      g.fillStyle = cap;
      g.beginPath(); g.ellipse(x, y - h, w, w * .7, 0, Math.PI, 0); g.closePath(); g.fill();
      if (cap === '#c0533a') {
        g.fillStyle = '#fff';
        for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(x + (r() - .5) * w, y - h - r() * w * .4, .9 * s, 0, 7); g.fill(); }
      }
    },
    flower(g, x, y, s, it) {
      const r = rng(it.seed);
      const cols = ['#f4c6d6', '#fff4c2', '#c9d8ff', '#ffffff'];
      const c = cols[(r() * cols.length) | 0];
      for (let i = 0; i < 3; i++) {
        const ex = x + (r() - .5) * 10 * s, ey = y - (10 + r() * 10) * s;
        g.strokeStyle = '#5c9a4a'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x, (y + ey) / 2, ex, ey); g.stroke();
        g.fillStyle = c;
        for (let k = 0; k < 5; k++) {
          const a = k * 1.2566;
          g.beginPath(); g.arc(ex + Math.cos(a) * 1.6 * s, ey + Math.sin(a) * 1.6 * s, 1.3 * s, 0, 7); g.fill();
        }
        g.fillStyle = '#f2b84b'; g.beginPath(); g.arc(ex, ey, .9 * s, 0, 7); g.fill();
      }
    },
    deer(g, x, y, s) {
      g.strokeStyle = '#f2efe6'; g.fillStyle = '#f2efe6'; g.lineWidth = 1.4 * s; g.lineCap = 'round';
      const by = y - 10 * s;
      for (const dx of [-5, -3, 3, 5]) { g.beginPath(); g.moveTo(x + dx * s, by); g.lineTo(x + dx * s, y); g.stroke(); }
      g.beginPath(); g.ellipse(x, by, 7 * s, 3.6 * s, 0, 0, 7); g.fill();
      g.beginPath(); g.moveTo(x + 5 * s, by - 1 * s); g.lineTo(x + 8 * s, by - 8 * s); g.stroke();
      g.beginPath(); g.ellipse(x + 9.5 * s, by - 8.5 * s, 2.8 * s, 1.6 * s, .3, 0, 7); g.fill();
      g.strokeStyle = '#a8865a'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x + 8 * s, by - 10 * s); g.lineTo(x + 6 * s, by - 14 * s); g.lineTo(x + 4 * s, by - 15 * s);
      g.moveTo(x + 6.6 * s, by - 12.5 * s); g.lineTo(x + 8.5 * s, by - 15 * s); g.stroke();
    },
    torii(g, x, y, s) {
      g.lineCap = 'butt';
      g.strokeStyle = '#c8442f'; g.lineWidth = 2.2 * s;
      g.beginPath(); g.moveTo(x - 7 * s, y); g.lineTo(x - 6 * s, y - 20 * s); g.moveTo(x + 7 * s, y); g.lineTo(x + 6 * s, y - 20 * s); g.stroke();
      g.lineWidth = 1.8 * s;
      g.beginPath(); g.moveTo(x - 10 * s, y - 15 * s); g.lineTo(x + 10 * s, y - 15 * s); g.stroke();
      g.strokeStyle = '#2b2622'; g.lineWidth = 2.4 * s;
      g.beginPath(); g.moveTo(x - 13 * s, y - 22 * s); g.quadraticCurveTo(x, y - 20 * s, x + 13 * s, y - 22 * s); g.stroke();
    },
    house(g, x, y, s) {
      g.fillStyle = '#8b6a48'; g.fillRect(x - 8 * s, y - 10 * s, 16 * s, 10 * s);
      g.fillStyle = '#4e3626';
      g.beginPath(); g.moveTo(x - 11 * s, y - 9 * s); g.lineTo(x, y - 19 * s); g.lineTo(x + 11 * s, y - 9 * s); g.closePath(); g.fill();
      g.fillStyle = '#ffd27a'; g.fillRect(x + 2 * s, y - 7 * s, 3.5 * s, 3 * s);
      g.fillStyle = '#3a281c'; g.fillRect(x - 5 * s, y - 6 * s, 3.5 * s, 6 * s);
    },
    lantern(g, x, y, s) {
      g.fillStyle = '#8f8c84';
      g.fillRect(x - 5 * s, y - 3 * s, 10 * s, 3 * s);
      g.fillRect(x - 1.8 * s, y - 11 * s, 3.6 * s, 8 * s);
      g.fillRect(x - 4.5 * s, y - 13 * s, 9 * s, 2 * s);
      g.fillStyle = '#ffd27a'; g.fillRect(x - 3 * s, y - 18 * s, 6 * s, 5 * s);
      g.fillStyle = '#8f8c84';
      g.beginPath(); g.moveTo(x - 7 * s, y - 18 * s); g.lineTo(x, y - 23 * s); g.lineTo(x + 7 * s, y - 18 * s); g.closePath(); g.fill();
      g.beginPath(); g.arc(x, y - 24 * s, 1.5 * s, 0, 7); g.fill();
    },
  };
  // ---- Growth stages ----
  const STAGES = [
    { n: '胞子', r: 10 },
    { n: '芽', r: 14 },
    { n: '若い苔', r: 19, m: 0 },
    { n: 'ひと株', r: 25, m: 1 },
    { n: '苔玉', r: 32, m: 2 },
    { n: '大きな苔玉', r: 40, m: 4 },
    { n: '苔山', r: 50, m: 3 },
    { n: '苔の森', r: 62, m: 5 },
  ];
  const FOREST_BONUS_MOSS = 6;
  const POINTS = [0, 2, 5, 10, 20, 40, 80, 160];
  const ORNAMENTS = [
    { k: 'stone', n: '石', r: 15, w: 4 }, { k: 'mushroom', n: 'きのこ', r: 12, w: 3 },
    { k: 'fern', n: 'シダ', r: 14, w: 3 }, { k: 'flower', n: '小花', r: 12, w: 3 },
    { k: 'deer', n: '白い鹿', r: 18, w: 1 }, { k: 'lantern', n: '石灯籠', r: 17, w: 1 },
    { k: 'torii', n: '鳥居', r: 19, w: 1 }, { k: 'house', n: '小さな家', r: 18, w: 1 },
  ];
  const ORN = Object.fromEntries(ORNAMENTS.map((o) => [o.k, o]));
  const DEFAULT_UNLOCKS = { moss: [0, 1], obj: ['stone'] };
  function loadUnlocks() {
    const u = store.get('kokerium.unlocks.v1', null) || {};
    return {
      moss: [...new Set([...(Array.isArray(u.moss) ? u.moss : []), ...DEFAULT_UNLOCKS.moss])],
      obj: [...new Set([...(Array.isArray(u.obj) ? u.obj : []), ...DEFAULT_UNLOCKS.obj])],
    };
  }

  // ---- Vessels: inner boundary as a polyline (left rim -> floor -> right rim) ----
  function arcPts(cx, cy, r, a0, a1, n) {
    const pts = [];
    for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
    return pts;
  }
  const VESSELS = {
    jar: {
      n: '瓶', note: 'ふつう', rim: 118, open: [64, 316], glass: true,
      pts: [[60, 96], [60, 438], ...arcPts(100, 438, 40, Math.PI, Math.PI / 2, 8).slice(1), ...arcPts(280, 438, 40, Math.PI / 2, 0, 8).slice(1), [320, 96]],
      inner: [190, 300],
    },
    bowl: (() => {
      const cx = 190, cy = 312, r = 176, rim = 168;
      const a = Math.asin((rim - cy) / r);
      return {
        n: '丸い鉢', note: '口がせまい', rim: rim + 14, glass: true,
        open: [cx - r * Math.cos(a) + 6, cx + r * Math.cos(a) - 6],
        pts: arcPts(cx, cy, r, Math.PI - a, a, 48),
        inner: [cx, cy], circle: { cx, cy, r, a },
      };
    })(),
    dish: {
      n: '平皿', note: 'こぼれやすい', rim: 250, open: [40, 340], glass: false, spill: 5,
      pts: [[18, 426], [52, 468], [328, 468], [362, 426]],
      inner: [190, 380],
    },
  };
  for (const v of Object.values(VESSELS)) {
    // Glass vessels get invisible walls rising from the rim so pops can't leap over the edge.
    if (v.glass) {
      const [lx, ly] = v.pts[0], [rx, ry] = v.pts[v.pts.length - 1];
      v.phys = [[lx, -600], [lx, ly], ...v.pts.slice(1, -1), [rx, ry], [rx, -600]];
    } else v.phys = v.pts;
    v.segs = [];
    for (let i = 0; i < v.phys.length - 1; i++) {
      const [ax, ay] = v.phys[i], [bx, by] = v.phys[i + 1];
      const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
      let nx = -dy, ny = dx;
      const l = Math.hypot(nx, ny); nx /= l; ny /= l;
      const mx = (ax + bx) / 2, my = (ay + by) / 2;
      if ((v.inner[0] - mx) * nx + (v.inner[1] - my) * ny < 0) { nx = -nx; ny = -ny; }
      v.segs.push({ ax, ay, dx, dy, len2, nx, ny });
    }
  }
  function vesselPath(g, v) {
    g.beginPath();
    v.pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
  }

  // ---- Sprites ----
  function accent(g, m, r, x, y, k) {
    g.lineCap = 'round';
    switch (m.style) {
      case 'ball':
        g.strokeStyle = '#8a5a2b'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - 6 * k); g.stroke();
        g.fillStyle = '#d4ea86'; g.strokeStyle = '#5b7a2a';
        g.beginPath(); g.arc(x, y - 7 * k, 2.2 * k, 0, 7); g.fill(); g.stroke();
        break;
      case 'tree':
        g.strokeStyle = m.light; g.lineWidth = 1;

      updateStats();
      if (V.spill && spills >= V.spill) gameOver('お皿からこぼれすぎた。');
      const over = bodies.some((b) => b.age > 1.2 && b.y - b.r < V.rim && Math.hypot(b.x - b.px, b.y - b.py) < 2);
      dangerT = over ? dangerT + dt : 0;
      if (dangerT > 2.2 && state === 'playing') gameOver('縁からあふれた。');
    }
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt; p.life -= dt; }
    particles = particles.filter((p) => p.life > 0);
    for (const f of floaters) f.t += dt;
    floaters = floaters.filter((f) => f.t < 1.2);
    draw(now);
    requestAnimationFrame(frame);
  }

  renderLog(); renderLadder(); updateStats();
  requestAnimationFrame(frame);
})();
</script>
